<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bid on Items</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f5ff;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1000px;
            width: 90%;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #0056b3;
        }

        .items-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .auction-card {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 220px;
            text-align: center;
        }

        .auction-card img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
        }

        .bid-form {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        input[type="number"] {
            width: 80%;
            padding: 8px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            display: block;
        }

        input[type="submit"] {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            cursor: pointer;
            font-size: 14px;
            border-radius: 5px;
            transition: 0.3s;
        }

        input[type="submit"]:hover {
            background-color: #0056b3;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 15px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: 0.3s;
        }

        a:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Bid on Auction Items</h2>
        
        <div class="items-grid">
            {% for item in bid_items %}
            <div class="auction-card">
                <img src="{{ item[3] }}" alt="Auction Item">
                <p><strong>{{ item[1] }}</strong> - ${{ item[2] }}</p>
                <form action="/bid" method="post" class="bid-form">
                    <input type="hidden" name="item_id" value="{{ item[0] }}">
                    <label>Bid Amount:</label>
                    <input type="number" step="0.01" name="bid_amount" required>
                    <input type="submit" value="Place Bid">
                </form>
            </div>
            {% endfor %}
        </div>

        <a href="{{ url_for('user_home') }}">Back to Home</a>
    </div>
</body>
</html>
