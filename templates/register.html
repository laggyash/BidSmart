<!DOCTYPE html>
<html>
  <head>
    <title>Register</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background-color: #e3f2fd;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
        text-align: center;
      }

      .logo-container {
        padding-top: 10%;
      }

      .logo-container img {
        width: 150px;
        height: auto;
      }

      h2 {
        color: #0d47a1;
        font-size: 36px;
        font-weight: 600;
        margin-bottom: 15px;
      }

      form {
        background: white;
        width: 400px;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        text-align: left;
      }

      label {
        font-weight: 500;
        display: block;
        margin-top: 15px;
      }

      input,
      select {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
      }

      input[type="submit"],
      button {
        background-color: #0d47a1;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 8px;
        font-size: 18px;
        font-weight: 500;
        cursor: pointer;
        width: 100%;
        margin-top: 15px;
        transition: 0.3s;
      }

      input[type="submit"]:hover,
      button:hover {
        background-color: #1565c0;
        transform: scale(1.05);
      }

      #admin_code_section {
        margin-top: 10px;
      }

      p {
        font-size: 14px;
        margin-top: 15px;
      }

      a {
        text-decoration: none;
        width: 100%;
        display: flex;
        justify-content: center;
      }

      .login-button {
        width: fit-content;
        padding-left: 30px;
        padding-right: 30px;
      }
    </style>
  </head>
  <body>
    <div class="logo-container">
      <img
        src="{{ url_for('static', filename='images/logo.webp') }}"
        alt="BidSmart Logo"
      />
    </div>

    <h2>Register</h2>

    {% with messages = get_flashed_messages(with_categories=true) %} {% if
    messages %} {% for category, message in messages %}
    <script>
      alert("{{ message }}");
    </script>
    {% endfor %} {% endif %} {% endwith %}

    <form action="/register" method="post">
      <label>Name:</label>
      <input type="text" name="name" required />

      <label>Username:</label>
      <input type="text" name="username" required />

      <label>Email:</label>
      <input type="email" name="email" required />

      <label>Password:</label>
      <input type="password" name="password" required />

      <label for="role">Register As:</label>
      <select name="role" id="role" onchange="toggleAdminCode()">
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>

      <div id="admin_code_section" style="display: none">
        <label for="admin_code">Admin Code:</label>
        <input type="password" name="admin_code" id="admin_code" />
      </div>

      <script>
        function toggleAdminCode() {
          var role = document.getElementById("role").value;
          var adminCodeSection = document.getElementById("admin_code_section");
          adminCodeSection.style.display = role === "admin" ? "block" : "none";
        }
      </script>

      <input type="submit" value="Register" />
    </form>

    <p>Already have an account?</p>
    <a href="{{ url_for('login') }}">
      <button class="login-button">Login</button>
    </a>
  </body>
</html>
