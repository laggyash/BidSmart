<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Submit Item</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: #f0f5ff;
      }
      .container {
        max-width: 600px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Submit an Item for Auction</h2>
      <form action="/submit_item" method="post">
        <label>Item Name:</label>
        <input type="text" name="item_name" required /><br />

        <label>Base Price:</label>
        <input type="number" step="0.01" name="base_price" required /><br />

        <label>Image URL:</label>
        <input type="text" name="image_url" required /><br />

        <input type="submit" value="Submit" />
      </form>
      <br />
      <a href="{{ url_for('user_home') }}">Back to Home</a>
    </div>
  </body>
</html>
