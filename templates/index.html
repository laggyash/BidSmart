<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BidSmart - Home</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Body Styling */
        body {
            background-color: #e3f2fd; /* Light Blue */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Header */
        header {
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #0d47a1; /* Dark Blue */
            margin-bottom: 20px;
        }

        /* Container */
        #container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 300px;
        }

        /* Buttons */
        button {
            background-color: #0d47a1; /* Dark Blue */
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
            transition: 0.3s;
        }

        button:hover {
            background-color: #1565c0; /* Lighter Blue */
        }

        a {
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to BidSmart</h1>
        <div id="container">
            <a href="/register"><button>Register</button></a>
            <a href="/login"><button>Login</button></a>
        </div>
    </header>
</body>
</html>
