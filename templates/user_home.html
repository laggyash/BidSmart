<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f5ff;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .logo-container {
            margin-bottom: 20px;
        }

        .logo {
            max-width: 150px;
            height: auto;
        }

        h2 {
            color: #0056b3;
        }

        h3 {
            color: #007bff;
            margin-top: 20px;
        }

        form {
            background: #eef3ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            text-align: left;
            display: inline-block;
        }

        input[type="text"], input[type="number"] {
            width: 90%;
            padding: 8px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            display: block;
        }

        input[type="submit"] {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
            transition: 0.3s;
        }

        input[type="submit"]:hover {
            background-color: #0056b3;
        }

        .auction-card {
            background: #fff;
            padding: 15px;
            margin: 10px auto;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 90%;
            text-align: center;
        }

        .auction-card img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
        }

        .bid-form {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logout {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 15px;
            background: #dc3545;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: 0.3s;
        }

        .logout:hover {
            background: #b02a37;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo added at the top -->
        <div class="logo-container">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="BidSmart Logo" class="logo">
        </div>

        <h2>Welcome, {{ username }}</h2>

        <h3>Submit an Item for Auction</h3>
        <form action="/submit_item" method="post">
            <label>Item Name:</label>
            <input type="text" name="item_name" required>
            
            <label>Base Price:</label>
            <input type="number" step="0.01" name="base_price" required>

            <label>Image URL:</label>
            <input type="text" name="image_url" required>

            <input type="submit" value="Submit">
        </form>

        <h3>Active Auctions</h3>
        {% for item in items %}
        <div class="auction-card">
            <p><strong>{{ item[1] }}</strong> - ${{ item[2] }}</p>
            <img src="{{ item[3] }}" alt="Auction Item">
            <form action="/bid" method="post" class="bid-form">
                <input type="hidden" name="item_id" value="{{ item[0] }}">
                <label>Bid Amount:</label>
                <input type="number" step="0.01" name="bid_amount" required>
                <input type="submit" value="Place Bid">
            </form>
        </div>
        {% endfor %}

        <a href="/logout" class="logout">Logout</a>
    </div>
</body>
</html>
