<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Dashboard</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background-color: #f0f5ff;
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;  
        height: 100vh;
        text-align: center;
      }

      .container {
        max-width: 1000px;
        width: 50%;
        padding: 25px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
      }

      .logo-container {
        margin-bottom: 10px;
      }

      .logo {
        max-width: 130px;
        height: auto;
      }

      h2 {
        color: #0d47a1;
        font-size: 24px;
        margin-bottom: 15px;
      }

      .nav-links {
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
        margin-top: 10px;
      }

      .nav-links a {
        width: 100%;
        max-width: 250px;
        display: block;
        padding: 12px;
        background-color: #007bff;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-size: 16px;
        transition: 0.3s;
      }

      .nav-links a:hover {
        background-color: #0056b3;
      }
      .logout {
    display: block;
    margin: 20px auto; /* Centers horizontally */
    width: fit-content;
    padding: 10px;
    padding-left: 20px;
    padding-right: 20px;
    background: #dc3545;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-size: 16px;
    transition: 0.3s;
    text-align: center; /* Ensures text is centered */
}


      .logout:hover {
        background: #b02a37;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo-container">
        <img
          src="{{ url_for('static', filename='images/logo.webp') }}"
          alt="BidSmart Logo"
          class="logo"
        />
      </div>

      <h2>Welcome, {{ user_name }}</h2>

      <div class="nav-links">
        <a href="{{ url_for('submit_item_page') }}">Submit an Item</a>
        <a href="{{ url_for('my_items') }}">My Items</a>
        <a href="{{ url_for('bid_items') }}">Bid on Items</a>
      </div>

      <a href="/logout" class="logout">Logout</a>
    </div>
  </body>
</html>
