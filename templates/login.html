<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | BidSmart</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background-color: #f0f5ff;
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
      }

      .container {
        max-width: 360px;
        padding: 25px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
      }

      .logo-container {
        margin-bottom: 10px;
      }

      .logo {
        max-width: 130px;
        height: auto;
      }

      h2 {
        color: #0d47a1;
        font-size: 26px;
        margin-bottom: 15px;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
      }

      input[type="submit"],
      button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
        width: 100%;
        margin-top: 5px;
      }

      input[type="submit"]:hover,
      button:hover {
        background-color: #0056b3;
      }

      p {
        font-size: 14px;
        margin-top: 12px;
      }

      a {
        text-decoration: none;
        width: 100%;
        display: flex;
        justify-content: center;
      }

      .register-button {
        background-color: #28a745;
      }

      .register-button:hover {
        background-color: #1e7e34;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo-container">
        <img
          src="{{ url_for('static', filename='images/logo.webp') }}"
          alt="BidSmart Logo"
          class="logo"
        />
      </div>

      <h2>Login</h2>
      <form action="/login" method="post">
        <input type="text" name="username" placeholder="Username" required />
        <input
          type="password"
          name="password"
          placeholder="Password" required />
        <input type="submit" value="Login" />
      </form>

      <p>Don't have an account?</p>
      <a href="{{ url_for('register') }}">
        <button class="register-button">Register</button>
      </a>
    </div>
  </body>
</html>
